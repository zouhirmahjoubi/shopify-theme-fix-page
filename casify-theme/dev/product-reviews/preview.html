<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Casify review board preview</title>
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="../../assets/cv-pdp-story.css">
  <link rel="stylesheet" href="../../assets/cv-pdp-extras.css">
  <link rel="stylesheet" href="../../assets/cv-pdp-home.css">
  <link rel="stylesheet" href="../../assets/cv-pdp-reviews.css">
  <style>
    body { margin: 0; background: #f6f0df; }
    .preview-nav { display: flex; align-items: center; justify-content: center; min-height: 76px; padding-inline: 18px; color: #fff9ed; background: #4a3324; font: 900 clamp(19px, 4.8vw, 26px)/1.1 var(--font-display); text-align: center; }
  </style>
</head>
<body>
  <header class="preview-nav">Casify · the review counter</header>
  <main>
    <section class="cvw cvw-reviews cvp-reviews" id="cvc-reviews" data-cvw-reviews data-review-rating="0" data-review-max="5" data-review-count="0" data-review-has-rating="false" aria-labelledby="cvpReviewsTitle-preview">
      <div class="cvp__inner">
        <div class="cvw-reviews__stage" data-cvw-review-stage>
          <div class="cvw-reviews__three" data-cvw-review-three aria-hidden="true"></div>
          <div class="cvw-board" data-cvw-board>
            <div class="cvw-board__tilt" data-cvw-review-tilt>
              <img class="cvw-board__slate" src="../../assets/pdp-home-chalkboard.webp" width="1200" height="848" alt="">
              <div class="cvw-board__chalk">
                <h2 class="cvw-board__title" id="cvpReviewsTitle-preview" data-cvw-chalk>What shoppers say</h2>
                <p class="cvw-board__stars">
                  <span class="cv-stars cvw-board__stars-row" style="--fill:0%" aria-hidden="true">
                    <span class="cv-stars__row"><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg></span>
                    <span class="cv-stars__row cv-stars__row--fill"><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.9l2.8 5.7 6.3.9-4.55 4.45 1.07 6.27L12 17.26l-5.62 2.96 1.07-6.27L2.9 9.5l6.3-.9z"/></svg></span>
                  </span>
                </p>
                <p class="cvw-board__empty" data-cvw-chalk>No reviews yet</p>
                <p class="cvw-board__hint" data-cvw-chalk>Bought this case? Your review goes up on this board.</p>
                <svg class="cvw-board__underline" viewBox="0 0 320 24" preserveAspectRatio="none" aria-hidden="true"><path data-cvw-chalk-line d="M4 16 C 60 6, 140 22, 200 12 S 290 8, 316 14"/></svg>
              </div>
            </div>
          </div>
          <aside class="cvw-reviews__note" data-cvw-review-note aria-label="Customer review ledger">
            <span class="cvw-reviews__note-pin" aria-hidden="true"></span>
            <span class="cvw-reviews__note-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 4.5h18v23H7z"/><path d="M11 10h10M11 15h10M11 20h6"/><path d="m21.5 22 2 2 4-5"/></svg></span>
            <p class="cvw-reviews__note-copy">Every mark on this board comes from real shopper review data for this product.</p>
            <span class="cvw-reviews__live"><i aria-hidden="true"></i>Live product rating</span>
            <span class="cvw-reviews__state">Waiting for the first customer note</span>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <script src="../../assets/gsap.min.js"></script>
  <script src="../../assets/gsap-CustomEase.min.js"></script>
  <script src="../../assets/gsap-DrawSVGPlugin.min.js"></script>
  <script src="../../assets/gsap-ScrollTrigger.min.js"></script>
  <script src="../../assets/gsap-init.js"></script>
  <script type="module" src="../../assets/cv-pdp-reviews.js"></script>
</body>
</html>
