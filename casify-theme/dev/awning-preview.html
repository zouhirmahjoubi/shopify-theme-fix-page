<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Main image awning</title>
<script>(function(r){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;r.classList.add('cvc-pending');setTimeout(function(){r.classList.remove('cvc-pending')},1400)})(document.documentElement)</script>
<link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/cv-pdp-counter.css">
<style>body{background:var(--cream-100)}.wrap{display:grid;gap:28px;justify-items:center;padding:30px 16px}.cvc__stage{width:min(520px,100%)}.lbl{font:11px var(--font-label);color:var(--cocoa-500)}</style></head>
<body><div class="cvc"><div class="wrap">
<p class="lbl">Default product page — red, 16 stripes (scroll or swipe sideways over the awning to switch red / teal; hover for a gust)</p>
<div style="width:min(520px,100%)"><div class="cvc__stage cvc__stage--awning-true"><div
    class="cv-awning cv-awning--red"
    data-cv-awning
    data-stripes="16"
    style="--cv-awning-ratio: 320 / 30;"
    aria-hidden="true"
  >
    <svg class="cv-awning__flat" viewBox="0 0 320 30" focusable="false">
      <defs>
        <linearGradient id="cv-awning-shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000" stop-opacity=".16"/>
          <stop offset=".45" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
      </defs><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="0" y="0" width="20.4" height="18.6"/>
          <path d="M0 18.5A10 10 0 0 0 20 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="20" y="0" width="20.4" height="18.6"/>
          <path d="M20 18.5A10 10 0 0 0 40 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="40" y="0" width="20.4" height="18.6"/>
          <path d="M40 18.5A10 10 0 0 0 60 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="60" y="0" width="20.4" height="18.6"/>
          <path d="M60 18.5A10 10 0 0 0 80 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="80" y="0" width="20.4" height="18.6"/>
          <path d="M80 18.5A10 10 0 0 0 100 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="100" y="0" width="20.4" height="18.6"/>
          <path d="M100 18.5A10 10 0 0 0 120 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="120" y="0" width="20.4" height="18.6"/>
          <path d="M120 18.5A10 10 0 0 0 140 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="140" y="0" width="20.4" height="18.6"/>
          <path d="M140 18.5A10 10 0 0 0 160 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="160" y="0" width="20.4" height="18.6"/>
          <path d="M160 18.5A10 10 0 0 0 180 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="180" y="0" width="20.4" height="18.6"/>
          <path d="M180 18.5A10 10 0 0 0 200 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="200" y="0" width="20.4" height="18.6"/>
          <path d="M200 18.5A10 10 0 0 0 220 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="220" y="0" width="20.4" height="18.6"/>
          <path d="M220 18.5A10 10 0 0 0 240 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="240" y="0" width="20.4" height="18.6"/>
          <path d="M240 18.5A10 10 0 0 0 260 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="260" y="0" width="20.4" height="18.6"/>
          <path d="M260 18.5A10 10 0 0 0 280 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="280" y="0" width="20.4" height="18.6"/>
          <path d="M280 18.5A10 10 0 0 0 300 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="300" y="0" width="20.4" height="18.6"/>
          <path d="M300 18.5A10 10 0 0 0 320 18.5Z"/>
        </g><rect class="cv-awning__shade" x="0" y="0" width="320" height="18.6" fill="url(#cv-awning-shade)"/>
      <rect class="cv-awning__rod" x="0" y="0" width="320" height="1.6"/>
    </svg><span class="cv-awning__hit" data-cv-awning-hit title="Scroll or swipe sideways to change the awning"></span></div><img class="cvc__photo" id="cvMainImage" src="/assets/footer-item-case.webp" alt="Sample product photo"><button type="button" class="cvc__zoom"><span>Tap to zoom</span></button></div></div>
<button type="button" id="swap" style="font:12px var(--font-label)">Swap photo</button>
<p class="lbl">Teal, 12 stripes</p>

        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="100" y="0" width="20.4" height="18.6"/>

          <rect x="180" y="0" width="20.4" height="18.6"/>
          <path d="M180 18.5A10 10 0 0 0 200 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--a">
          <rect x="200" y="0" width="20.4" height="18.6"/>
          <path d="M200 18.5A10 10 0 0 0 220 18.5Z"/>
        </g><g class="cv-awning__stripe cv-awning__stripe--b">
          <rect x="220" y="0" width="20.4" height="18.6"/>
          <path d="M220 18.5A10 10 0 0 0 240 18.5Z"/>
        </g><rect class="cv-awning__shade" x="0" y="0" width="240" height="18.6" fill="url(#cv-awning-shade)"/>
      <rect class="cv-awning__rod" x="0" y="0" width="240" height="1.6"/>
    </svg><span class="cv-awning__hit" data-cv-awning-hit title="Scroll or swipe sideways to change the awning"></span></div><img class="cvc__photo" id="cvMainImage" src="/assets/footer-item-gift.webp" alt="Sample product photo"><button type="button" class="cvc__zoom"><span>Tap to zoom</span></button></div></div>
</div></div>
<script src="/assets/gsap.min.js"></script><script src="/assets/gsap-init.js"></script><script type="module" src="/assets/cv-awning.js"></script>
<script>document.getElementById('swap').onclick=function(){var i=document.querySelector('#cvMainImage');i.src=i.src.indexOf('case')>-1?'/assets/footer-item-jar.webp':'/assets/footer-item-case.webp'}</script>
</body></html>
