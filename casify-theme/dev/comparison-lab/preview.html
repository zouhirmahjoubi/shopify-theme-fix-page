<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Casify comparison lab preview</title>
    <link rel="stylesheet" href="../../assets/theme.css">
    <link rel="stylesheet" href="../../assets/cv-compare-lab.css">
    <style>
      body { margin: 0; }
      .cv-ico { display: block; width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <symbol id="i-lab" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
      <symbol id="i-cross" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
      <symbol id="i-case" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><circle cx="12" cy="13" r="4"/></symbol>
      <symbol id="i-seal" viewBox="0 0 24 24"><path d="M12 2l2.2 2 3-.2.5 3 2.5 1.6-1.3 2.8 1.3 2.8-2.5 1.6-.5 3-3-.2-2.2 2-2.2-2-3 .2-.5-3L3.8 15l1.3-2.8-1.3-2.8L6.3 7.8l.5-3 3 .2z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></symbol>
    </svg>

    <section class="cv-sec cvcx" data-cvcx aria-labelledby="preview-title">
      <div class="cvcx__awning" aria-hidden="true"><span></span></div>
      <div class="cvcx__inner">
        <header class="cvcx__intro">
          <div class="cvcx__copy">
            <h2 class="cvcx__title" id="preview-title" data-cvcx-title>Put it next to what you almost bought</h2>
            <div class="cvcx__lede" data-cvcx-lede><p>Same test, same lab, same day. Only the case changed.</p></div>
            <div class="cvcx__rule" aria-hidden="true"><svg viewBox="0 0 480 26" preserveAspectRatio="none"><path data-cvcx-rule d="M3 17 C 70 5, 142 24, 214 13 S 350 8, 477 15"/></svg></div>
          </div>
          <div class="cvcx__stage" data-cvcx-stage aria-hidden="true">
            <div class="cvcx__three" data-cvcx-three></div>
            <svg class="cvcx__fallback" viewBox="0 0 640 390" role="presentation">
              <path class="cvcx__fallback-shelf" d="M70 326h500l-20 30H90z"/>
              <g class="cvcx__fallback-case cvcx__fallback-case--one"><rect x="112" y="75" width="124" height="238" rx="26"/><rect x="131" y="94" width="48" height="49" rx="14"/><circle cx="155" cy="218" r="43"/></g>
              <g class="cvcx__fallback-case cvcx__fallback-case--two"><rect x="258" y="62" width="124" height="251" rx="26"/><rect x="277" y="82" width="48" height="49" rx="14"/><circle cx="320" cy="211" r="43"/></g>
              <g class="cvcx__fallback-case cvcx__fallback-case--three"><rect x="404" y="48" width="134" height="265" rx="28"/><rect x="424" y="69" width="52" height="53" rx="15"/><circle cx="471" cy="199" r="46"/></g>
              <path class="cvcx__fallback-tick" d="m292 272 16 16 37-45"/>
            </svg>
            <span class="cvcx__stage-label">Three specimens · one test bench</span>
          </div>
        </header>

        <div class="cvcx__ledger" data-cvcx-ledger>
          <span class="cvcx__clip cvcx__clip--left" aria-hidden="true"></span>
          <span class="cvcx__clip cvcx__clip--right" aria-hidden="true"></span>
          <table class="cvcx__table">
            <caption class="cvcx__caption">Put it next to what you almost bought</caption>
            <thead>
              <tr>
                <th scope="col" class="cvcx__corner"><span class="cvcx__corner-icon"><svg class="cv-ico"><use href="#i-lab"/></svg></span><span>Measured</span></th>
                <th scope="col" class="cvcx__col is-us" data-cvcx-col="0">
                  <button class="cvcx__specimen" type="button" data-cvcx-activate="0" aria-pressed="true">
                    <span class="cvcx__specimen-media"><img src="../../assets/cv-spotlight-case.jpg" width="240" height="240" alt=""></span>
                    <span class="cvcx__winner"><svg class="cv-ico"><use href="#i-seal"/></svg> Our pick</span>
                    <span class="cvcx__col-name">Casify</span><span class="cvcx__col-note">$39</span>
                  </button>
                </th>
                <th scope="col" class="cvcx__col" data-cvcx-col="1">
                  <button class="cvcx__specimen" type="button" data-cvcx-activate="1" aria-pressed="false"><span class="cvcx__specimen-media"><svg viewBox="0 0 70 92"><rect x="12" y="4" width="46" height="84" rx="12"/><rect x="18" y="10" width="17" height="18" rx="5"/><circle cx="35" cy="54" r="15"/></svg></span><span class="cvcx__col-name">Designer clear</span><span class="cvcx__col-note">$65+</span></button>
                </th>
                <th scope="col" class="cvcx__col" data-cvcx-col="2">
                  <button class="cvcx__specimen" type="button" data-cvcx-activate="2" aria-pressed="false"><span class="cvcx__specimen-media"><svg viewBox="0 0 70 92"><rect x="10" y="3" width="50" height="86" rx="13"/><rect x="17" y="10" width="19" height="20" rx="5"/><circle cx="35" cy="55" r="15"/></svg></span><span class="cvcx__col-name">Rugged bulk</span><span class="cvcx__col-note">$55</span></button>
                </th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="cvcx__foot" data-cvcx-foot>
          <p class="cvcx__note"><svg class="cv-ico"><use href="#i-lab"/></svg><span>Rival figures measured in-house on retail units bought at full price.</span></p>
          <a class="cvcx__cta" href="#"><span>Find my model</span><svg class="cv-ico"><use href="#i-arrow"/></svg></a>
        </div>
      </div>
    </section>

    <script>
      const data = [
        ['Drop height before damage', '12 ft', '7.2 ft', '10.5 ft', 'val', 'val', 'val'],
        ['Magnet pull force', '1,400 g', '850 g', '1,100 g', 'val', 'val', 'val'],
        ['Back thickness', '2.8 mm', '3.1 mm', '6.4 mm', 'val', 'val', 'val'],
        ['Added weight', '24 g', '31 g', '78 g', 'val', 'val', 'val'],
        ['Still clear at 36 months', 'No shift', 'Yellow by month 4', 'Opaque', 'yes', 'no', 'no'],
        ['Qi2 25W through the case', 'Full speed', 'Full speed', 'Slowed', 'yes', 'yes', 'no'],
        ['Publishes its lab data', 'Yes', 'No', 'No', 'yes', 'no', 'no'],
        ['Pays for your screen', 'Up to $200', 'No', 'No', 'yes', 'no', 'no'],
        ['Returns window', '90 days', '30 days', '30 days', 'yes', 'val', 'val']
      ];
      const names = ['Casify', 'Designer clear', 'Rugged bulk'];
      const rows = document.getElementById('rows');
      data.forEach((row) => {
        const tr = document.createElement('tr');
        tr.className = 'cvcx__row';
        tr.dataset.cvcxRow = '';
        tr.innerHTML = `<th scope="row" class="cvcx__row-label"><span class="cvcx__row-icon"><svg class="cv-ico"><use href="#i-case"/></svg></span><span>${row[0]}</span></th>` + names.map((name, i) => {
          const kind = row[i + 4];
          const mark = kind === 'yes' ? '<span class="cvcx__mark is-yes"><svg class="cv-ico"><use href="#i-check"/></svg></span>' : kind === 'no' ? '<span class="cvcx__mark is-no"><svg class="cv-ico"><use href="#i-cross"/></svg></span>' : '';
          return `<td class="cvcx__cell is-${kind}${i === 0 ? ' is-us' : ''}" data-cvcx-col="${i}"><span class="cvcx__cell-name">${name}</span><span class="cvcx__cell-value">${mark}<span>${row[i + 1]}</span></span></td>`;
        }).join('');
        rows.appendChild(tr);
      });
    </script>
    <script src="../../assets/gsap.min.js"></script>
    <script src="../../assets/gsap-ScrollTrigger.min.js"></script>
    <script>gsap.registerPlugin(ScrollTrigger);</script>
    <script type="module" src="../../assets/cv-compare-lab.js"></script>
  </body>
</html>
