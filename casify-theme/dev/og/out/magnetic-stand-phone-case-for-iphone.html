<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG template</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Special+Elite&display=swap");

  :root {
    --red: #C4302B; --red-deep: #7E1A17; --teal: #6C9E9C;
    --cream: #FDF9F1; --cream-deep: #F2E9D8; --cocoa: #4A3324; --cocoa-soft: #6b4a34;
    --gold: #B08F52;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden;
    background: var(--cream); font-family: "Playfair Display", Georgia, serif;
  }
  .frame {
    position: absolute; inset: 0;
    padding: 22px;
  }
  .stripe-border {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(-45deg, var(--red) 0 20px, var(--cream) 20px 40px);
  }
  .inner {
    position: absolute; inset: 22px;
    background: var(--cream);
    border: 2px solid var(--cocoa);
    outline: 10px solid var(--cream);
    display: flex; align-items: center;
    padding: 0 56px;
    gap: 56px;
  }

  .photo-wrap {
    flex: 0 0 430px; position: relative; height: 430px;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-card {
    width: 400px; height: 400px; border-radius: 24px; overflow: hidden;
    background: #fff;
    box-shadow: 0 26px 50px -18px rgba(74,51,36,.45), 0 0 0 10px var(--cream), 0 0 0 12px var(--cocoa-soft);
    transform: rotate(-2.2deg);
  }
  .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .copy { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 18px; }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot {
    width: 34px; height: 34px; border-radius: 50%;
    background: repeating-conic-gradient(var(--red) 0 15deg, var(--cream) 15deg 30deg);
    box-shadow: 0 0 0 2px var(--cocoa);
  }
  .brand-word {
    font-family: "Special Elite", monospace; letter-spacing: .12em; text-transform: uppercase;
    font-size: 15px; font-weight: 700; color: var(--red-deep);
  }
  .brand-est { font-family: "Special Elite", monospace; font-size: 12px; color: var(--cocoa-soft); letter-spacing: .04em; }

  .title {
    margin: 0; font-weight: 900; font-size: 46px; line-height: 1.08; color: var(--cocoa);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  .price-row { display: flex; align-items: baseline; gap: 16px; }
  .price-now { font-weight: 900; font-size: 44px; color: var(--red-deep); }
  .price-was { font-size: 24px; color: var(--cocoa-soft); text-decoration: line-through; }

  .facts {
    font-family: "Special Elite", monospace; font-size: 15px; color: var(--cocoa-soft);
    letter-spacing: .02em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="stripe-border"></div>
    <div class="inner">
      <div class="photo-wrap">
        <div class="photo-card"><img src="../photos/p2.png" alt=""></div>
      </div>
      <div class="copy">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>
            <span class="brand-word">Casify</span><br>
            <span class="brand-est">Est. 1920 &middot; the candy-shop counter</span>
          </span>
        </div>
        <h1 class="title">Magnetic Stand Phone Case for iPhone</h1>
        <div class="price-row">
          <span class="price-now">$49.99</span>
        </div>
        <div class="facts">Free shipping &middot; 30-day returns &middot; ships in 1&ndash;3 business days</div>
      </div>
    </div>
  </div>
</body>
</html>
