<!doctype html>
<meta charset="utf-8">
<title>Press art check</title>
<style>
  /* ds-allow-hardcode:start  dev check page: the section's two backgrounds, no theme.css here. */
  body { margin: 0; font: 13px sans-serif; }
  section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px; }
  .cream { background: #FBF3E4; }
  .red { background: #A8231F; }
  img { width: 100%; height: auto; display: block; }
  .g { padding: 0; display: block; }
  /* ds-allow-hardcode:end */
</style>
<section class="cream" id="a"></section>
<section class="red" id="b"></section>
<section class="cream g"><img src="../../../assets/cv-press-garland.svg" alt=""></section>
<script>
  ['bauble-red', 'bauble-teal', 'holly', 'pine', 'bow', 'star', 'bell', 'cane'].forEach(function (n) {
    ['a', 'b'].forEach(function (id) {
      var i = new Image(); i.src = '../../../assets/cv-press-' + n + '.svg'; i.alt = n;
      document.getElementById(id).appendChild(i);
    });
  });
</script>
