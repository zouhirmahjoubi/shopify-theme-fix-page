<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casify hero — static preview</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/casify-hero.css">
<style>body{margin:0;}</style>
</head>
<body>

<section class="chero" data-casify-hero data-chero-state="0">
  <div class="chero__bg" aria-hidden="true">
    <span class="chero__bg-layer chero__bg-layer--0 is-active"></span>
    <span class="chero__bg-layer chero__bg-layer--1"></span>
    <span class="chero__bg-layer chero__bg-layer--2"></span>
    <span class="chero__vignette"></span>
    <span class="chero__grain"></span>
  </div>

  <div class="chero__inner">
    <div class="chero__topbar" data-chero-in>
      <span class="chero__brand">Casify</span>
      <span class="chero__badge"><span class="chero__badge-dot" aria-hidden="true"></span>New Collection</span>
    </div>

    <div class="chero__grid">
      <div class="chero__copy">
        <h1 class="chero__heading" data-chero-in>
          Protection,<br>
          <em class="chero__accent">perfected.</em>
        </h1>

        <div class="chero__lede" data-chero-in><p>Premium protection for your everyday.</p></div>

        <div class="chero__actions" data-chero-in>
          <a class="cv-cta chero__cta" href="#">
            <span class="cv-cta__shine" aria-hidden="true"></span>
            <span class="cv-ico" style="width:18px;height:18px;display:inline-flex">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.6 7.6h14.8l-1.1 12.8H5.7z"/>
                <path d="M9 7.6V5.8a3 3 0 0 1 6 0v1.8"/>
              </svg>
            </span>
            <span class="cv-cta__label">Shop cases</span>
          </a>
        </div>

        <ul class="chero__trust" data-chero-in>
          <li>Free shipping</li>
          <li class="chero__trust-dot" aria-hidden="true"></li>
          <li>30-day guarantee</li>
        </ul>
      </div>

      <div class="chero__stage" data-chero-stage>
        <span class="chero__stage-floor" aria-hidden="true"></span>

        <div class="chero__slot is-active" data-chero-slot="0">
          <div class="chero__phone-wrap chero__phone-wrap--pro">
            <img class="chero__phone" src="../../assets/casify-hero-iphone-pro.webp" width="966" height="1563" alt="iPhone 18 Pro" loading="eager">
          </div>
        </div>
        <div class="chero__slot" data-chero-slot="1">
          <div class="chero__phone-wrap chero__phone-wrap--promax">
            <img class="chero__phone" src="../../assets/casify-hero-iphone-promax.webp" width="958" height="1593" alt="iPhone 18 Pro Max" loading="lazy">
          </div>
        </div>
        <div class="chero__slot" data-chero-slot="2">
          <div class="chero__phone-wrap chero__phone-wrap--duo">
            <img class="chero__phone" src="../../assets/casify-hero-iphone-duo.webp" width="1206" height="1777" alt="iPhone Duo" loading="lazy">
          </div>
        </div>
      </div>
    </div>

    <div class="chero__nav" data-chero-in>
      <div class="chero__dots" role="tablist" aria-label="Featured case style">
        <button type="button" class="chero__dot is-active" data-chero-goto="0" role="tab" aria-selected="true" aria-label="iPhone 18 Pro"></button>
        <button type="button" class="chero__dot" data-chero-goto="1" role="tab" aria-selected="false" aria-label="iPhone 18 Pro Max"></button>
        <button type="button" class="chero__dot" data-chero-goto="2" role="tab" aria-selected="false" aria-label="iPhone Duo"></button>
      </div>
      <p class="chero__caption">
        <span class="chero__caption-item is-active" data-chero-caption="0">iPhone 18 Pro</span>
        <span class="chero__caption-sep" aria-hidden="true">&bull;</span>
        <span class="chero__caption-item" data-chero-caption="1">Pro Max</span>
        <span class="chero__caption-sep" aria-hidden="true">&bull;</span>
        <span class="chero__caption-item" data-chero-caption="2">Duo</span>
      </p>
    </div>
  </div>
</section>

<div style="background:#FBF3E4;padding:40px;font-family:Georgia">
  <p>&darr; rest of the (candy-shop) homepage would continue below, in the live theme.</p>
</div>

<script src="../../assets/casify-hero.js"></script>
</body>
</html>
