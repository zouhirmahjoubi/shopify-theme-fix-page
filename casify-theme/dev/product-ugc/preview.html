<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product: clips preview</title>
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/cv-pdp-story.css">
<link rel="stylesheet" href="../../assets/cv-pdp-home.css">
<style>
  /* Harness only. */
  body { background: #f6f3e6 url(../../assets/plates/page-ground.png) repeat; margin: 0; }
  .cv-ico svg { width: 100%; height: 100%; }
  .cv-ico { display: inline-flex; width: var(--s, 20px); height: var(--s, 20px); }
  .pv-spacer { display: grid; place-items: center; min-height: 92vh; font: 700 20px/1.4 system-ui; color: #8a6a4d; }
</style>
</head>
<body class="template-product cv-tpl">

<div class="pv-spacer">↓ scroll: the clips sit below the main product section ↓</div>

<div id="shopify-section-clips" class="shopify-section">
<section class="cvw cvw-ugc" data-cvw-ugc aria-labelledby="cvwUgcTitle-clips">
  <div class="cvp__inner">
    <div class="cvw-head">
      <h2 class="cvp__h2" id="cvwUgcTitle-clips" data-cvw-split>Three clips from the counter</h2>
      <p class="cvp__lede">Short clips of this case being handled: the snap, the turn in your hand, the everyday.</p>
    </div>

    <ol class="cvw-ugc__rail" role="list" data-cvw-ugc-rail style="--n:3">

      <li class="cvw-ugc__clip" data-cvw-ugc-clip style="--cv-i:0">
        <div class="cvw-ugc__screen" data-cvw-ugc-screen>
          <video class="cvw-ugc__video" data-cvw-ugc-video muted playsinline loop preload="metadata"
                 poster="../../assets/pdp-ugc-snap-on-poster.webp" aria-label="Snapping it on">
            <source src="../../assets/pdp-ugc-snap-on.mp4" type="video/mp4">
          </video>
          <span class="cvw-ugc__glass" aria-hidden="true"></span>
          <button type="button" class="cvw-ugc__open" data-cvw-ugc-open aria-label="Open this clip large: Snapping it on">
            <span class="cvw-ugc__expand" aria-hidden="true"><span class="cv-ico" style="width:15px;height:15px;color:currentColor" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.6H3.6V9M15 3.6h5.4V9M9 20.4H3.6V15M15 20.4h5.4V15"/></svg></span></span>
          </button>
          <div class="cvw-ugc__controls">
            <button type="button" class="cvw-ugc__btn" data-cvw-ugc-play aria-pressed="false"
                    data-play-label="Play this clip" data-pause-label="Pause this clip" aria-label="Play this clip">
              <span class="cvw-ugc__ico is-play" aria-hidden="true"><span class="cv-ico" style="width:14px;height:14px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.4 5.4a1 1 0 0 1 1.53-.85l8.2 5.15a1.3 1.3 0 0 1 0 2.2l-8.2 5.15a1 1 0 0 1-1.53-.85z"/></svg></span></span>
              <span class="cvw-ugc__ico is-pause" aria-hidden="true"><span class="cv-ico" style="width:14px;height:14px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg></span></span>
            </button>
          </div>
          <span class="cvw-ugc__bar" aria-hidden="true"><i data-cvw-ugc-bar></i></span>
        </div>
        <p class="cvw-ugc__tag"><span>Snapping it on</span></p>
      </li>

      <li class="cvw-ugc__clip" data-cvw-ugc-clip style="--cv-i:1">
        <div class="cvw-ugc__screen" data-cvw-ugc-screen>
          <video class="cvw-ugc__video" data-cvw-ugc-video muted playsinline loop preload="metadata"
                 poster="../../assets/pdp-ugc-in-hand-poster.webp" aria-label="In the hand">
            <source src="../../assets/pdp-ugc-in-hand.mp4" type="video/mp4">
          </video>
          <span class="cvw-ugc__glass" aria-hidden="true"></span>
          <button type="button" class="cvw-ugc__open" data-cvw-ugc-open aria-label="Open this clip large: In the hand">
            <span class="cvw-ugc__expand" aria-hidden="true"><span class="cv-ico" style="width:15px;height:15px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.6H3.6V9M15 3.6h5.4V9M9 20.4H3.6V15M15 20.4h5.4V15"/></svg></span></span>
          </button>
          <div class="cvw-ugc__controls">
            <button type="button" class="cvw-ugc__btn" data-cvw-ugc-play aria-pressed="false"
                    data-play-label="Play this clip" data-pause-label="Pause this clip" aria-label="Play this clip">
              <span class="cvw-ugc__ico is-play" aria-hidden="true"><span class="cv-ico" style="width:14px;height:14px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.4 5.4a1 1 0 0 1 1.53-.85l8.2 5.15a1.3 1.3 0 0 1 0 2.2l-8.2 5.15a1 1 0 0 1-1.53-.85z"/></svg></span></span>
              <span class="cvw-ugc__ico is-pause" aria-hidden="true"><span class="cv-ico" style="width:14px;height:14px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg></span></span>
            </button>
          </div>
          <span class="cvw-ugc__bar" aria-hidden="true"><i data-cvw-ugc-bar></i></span>
        </div>
        <p class="cvw-ugc__tag"><span>In the hand</span></p>
      </li>

      <li class="cvw-ugc__clip" data-cvw-ugc-clip style="--cv-i:2">
        <div class="cvw-ugc__screen" data-cvw-ugc-screen>
          <video class="cvw-ugc__video" data-cvw-ugc-video muted playsinline loop preload="metadata"
                 poster="../../assets/pdp-ugc-on-table-poster.webp" aria-label="On the table">
            <source src="../../assets/pdp-ugc-on-table.mp4" type="video/mp4">
          </video>
          <span class="cvw-ugc__glass" aria-hidden="true"></span>
          <button type="button" class="cvw-ugc__open" data-cvw-ugc-open aria-label="Open this clip large: On the table">
            <span class="cvw-ugc__expand" aria-hidden="true"><span class="cv-ico" style="width:15px;height:15px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.6H3.6V9M15 3.6h5.4V9M9 20.4H3.6V15M15 20.4h5.4V15"/></svg></span></span>
          </button>
          <div class="cvw-ugc__controls">
            <button type="button" class="cvw-ugc__btn" data-cvw-ugc-play aria-pressed="false"
                    data-play-label="Play this clip" data-pause-label="Pause this clip" aria-label="Play this clip">
              <span class="cvw-ugc__ico is-play" aria-hidden="true"><span class="cv-ico" style="width:14px;height:14px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.4 5.4a1 1 0 0 1 1.53-.85l8.2 5.15a1.3 1.3 0 0 1 0 2.2l-8.2 5.15a1 1 0 0 1-1.53-.85z"/></svg></span></span>
              <span class="cvw-ugc__ico is-pause" aria-hidden="true"><span class="cv-ico" style="width:14px;height:14px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg></span></span>
            </button>
          </div>
          <span class="cvw-ugc__bar" aria-hidden="true"><i data-cvw-ugc-bar></i></span>
        </div>
        <p class="cvw-ugc__tag"><span>On the table</span></p>
      </li>

    </ol>

    <span class="cvw-ugc__counter" aria-hidden="true"></span>

    <div class="cvw-ugc__foot">
      <button type="button" class="cvs__cta cvw-ugc__cta" data-cvp-back>Back to the case</button>
    </div>
  </div>

  <dialog class="cvw-ugc__dialog" data-cvw-ugc-dialog aria-label="Three clips from the counter">
    <div class="cvw-ugc__box">
      <div class="cvw-ugc__stage" data-cvw-ugc-stage></div>
      <button type="button" class="cvw-ugc__close" data-cvw-ugc-close aria-label="Close"><span class="cv-ico" style="width:18px;height:18px" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.2 6.2l11.6 11.6M17.8 6.2L6.2 17.8"/></svg></span></button>
    </div>
  </dialog>
</section>
</div>

<div class="pv-spacer">↓ the rest of the page continues here ↓</div>

<script src="../../assets/gsap.min.js"></script>
<script src="../../assets/gsap-CustomEase.min.js"></script>
<script src="../../assets/gsap-CustomBounce.min.js"></script>
<script src="../../assets/gsap-CustomWiggle.min.js"></script>
<script src="../../assets/gsap-ScrollTrigger.min.js"></script>
<script src="../../assets/gsap-DrawSVGPlugin.min.js"></script>
<script src="../../assets/gsap-SplitText.min.js"></script>
<script src="../../assets/gsap-init.js"></script>
<script src="../../assets/cv-pdp-story.js"></script>
<script src="../../assets/cv-pdp-home-motion.js"></script>
</body>
</html>
