<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Casify storyboard hero preview</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/casify-hero.css">
  <style>html,body{margin:0;background:#fbf3e4}</style>
</head>
<body>
  <section
    id="CasifyStoryHero-preview"
    class="csh"
    data-casify-story-hero
    data-intro-enabled="true"
    data-selected-model="iPhone 18 Pro 17 Pro"
    data-selected-color="Black"
    data-label-pause="Pause"
    data-label-resume="Resume"
    data-status-playing="Hero animation playing"
    data-status-paused="Hero animation paused"
    data-status-skipped="Hero animation skipped"
    data-status-complete="Hero animation complete"
    data-label-image-error="Image unavailable. View details to see this case."
    data-status-unavailable="This selection is currently unavailable."
  >
    <div class="csh__shell">
      <div class="csh__copy">
        <h1 class="csh__heading">Your iPhone. Your colour.</h1>
        <p class="csh__supporting">Cases for iPhone 18 Pro and Pro Max.</p>

        <div class="csh__shopping" data-csh-shopping>
          <fieldset class="csh__fieldset">
            <legend>Choose your iPhone</legend>
            <div class="csh__segmented">
              <button class="csh__model is-selected" type="button" aria-pressed="true" data-csh-model="iPhone 18 Pro 17 Pro"><span>iPhone 18 Pro</span><small>Pro fit</small></button>
              <button class="csh__model" type="button" aria-pressed="false" data-csh-model="iPhone 18 Pro Max 17 Pro Max"><span>iPhone 18 Pro Max</span><small>Pro Max fit</small></button>
            </div>
          </fieldset>

          <fieldset class="csh__fieldset csh__fieldset--colors">
            <legend>Choose colour <strong data-csh-selected-color>Black</strong></legend>
            <div class="csh__colors">
              <button class="csh__color is-selected" type="button" aria-label="Black" aria-pressed="true" data-csh-color="Black" style="--csh-swatch:#252225"><span aria-hidden="true"></span><small>Black</small></button>
              <button class="csh__color" type="button" aria-label="Silver" aria-pressed="false" data-csh-color="Silver" style="--csh-swatch:#c8c5be"><span aria-hidden="true"></span><small>Silver</small></button>
            </div>
          </fieldset>

          <div class="csh__actions">
            <a class="csh__cta" href="/products/mobile-phone-case-apple?variant=48739159015669" data-csh-cta><span>Shop cases</span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
            <a class="csh__details" href="/products/mobile-phone-case-apple" data-csh-details>View details</a>
          </div>

          <ul class="csh__facts" aria-label="Shopping benefits">
            <li><strong>Free shipping</strong><span>Every order</span></li>
            <li><strong>30-day returns</strong><span>Time to decide</span></li>
            <li><strong>Fast dispatch</strong><span>1-3 business days</span></li>
          </ul>
        </div>
      </div>

      <div class="csh__visual">
        <div class="csh__stage" data-csh-stage>
          <span class="csh__awning" aria-hidden="true"></span>
          <span class="csh__ribbon" data-csh-ribbon aria-hidden="true"></span>
          <span class="csh__coin" aria-hidden="true">C</span>
          <div class="csh__product-set" data-csh-product-set>
            <figure class="csh__device csh__device--one is-front" data-csh-device data-model="iPhone 18 Pro 17 Pro">
              <img class="csh__product-image" src="https://cdn.shopify.com/s/files/1/0816/4953/3173/files/acb70b3f-1bf2-4a9b-9ca3-de64b282a542.jpg?v=1787515622" width="1000" height="1000" alt="iPhone 18 Pro case" fetchpriority="high">
              <figcaption>iPhone 18 Pro</figcaption>
            </figure>
            <figure class="csh__device csh__device--two is-back" data-csh-device data-model="iPhone 18 Pro Max 17 Pro Max">
              <img class="csh__product-image" src="https://cdn.shopify.com/s/files/1/0816/4953/3173/files/3ecc32f5-3579-4c55-9a36-3427f9479e84.jpg?v=1787515622" width="1000" height="1000" alt="iPhone 18 Pro Max case">
              <figcaption>iPhone 18 Pro Max</figcaption>
            </figure>
          </div>
          <p class="csh__range-note">Two sizes shown - cases sold separately</p>
          <div class="csh__motion" data-csh-motion-controls aria-label="Hero animation controls" hidden>
            <button type="button" data-csh-pause disabled><svg class="csh__pause-icon" viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path d="M5.5 4.5v9M12.5 4.5v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="csh__play-icon" viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><path d="m6 4.5 7 4.5-7 4.5Z" fill="currentColor"/></svg><span data-csh-pause-label>Pause</span></button>
            <button type="button" data-csh-skip disabled>Skip</button>
            <button type="button" data-csh-replay>Replay</button>
          </div>
        </div>
        <p class="csh__selection" aria-live="polite"><span>Selected</span> <strong data-csh-selected-model>iPhone 18 Pro</strong> <i aria-hidden="true">·</i> <strong data-csh-selected-color-copy>Black</strong></p>
        <p class="csh__status visually-hidden" data-csh-status aria-live="polite"></p>
      </div>
    </div>

    <div hidden data-csh-variants>
      <span data-csh-variant data-id="48739159015669" data-model="iPhone 18 Pro 17 Pro" data-color="Black" data-available="true" data-url="/products/mobile-phone-case-apple?variant=48739159015669" data-image="https://cdn.shopify.com/s/files/1/0816/4953/3173/files/acb70b3f-1bf2-4a9b-9ca3-de64b282a542.jpg?v=1787515622"></span>
      <span data-csh-variant data-id="48739159048437" data-model="iPhone 18 Pro Max 17 Pro Max" data-color="Black" data-available="true" data-url="/products/mobile-phone-case-apple?variant=48739159048437" data-image="https://cdn.shopify.com/s/files/1/0816/4953/3173/files/097fbca4-d082-484f-8a8d-84a72ef4cd58.jpg?v=1787515623"></span>
      <span data-csh-variant data-id="48739160097013" data-model="iPhone 18 Pro 17 Pro" data-color="Silver" data-available="true" data-url="/products/mobile-phone-case-apple?variant=48739160097013" data-image="https://cdn.shopify.com/s/files/1/0816/4953/3173/files/f1dee6e4-9afa-448b-b104-077a642e24d5.jpg?v=1787515622"></span>
      <span data-csh-variant data-id="48739160129781" data-model="iPhone 18 Pro Max 17 Pro Max" data-color="Silver" data-available="true" data-url="/products/mobile-phone-case-apple?variant=48739160129781" data-image="https://cdn.shopify.com/s/files/1/0816/4953/3173/files/3ecc32f5-3579-4c55-9a36-3427f9479e84.jpg?v=1787515622"></span>
    </div>
  </section>

  <script src="../assets/casify-hero.js" defer></script>
  <script src="../assets/gsap.min.js" defer></script>
</body>
</html>
