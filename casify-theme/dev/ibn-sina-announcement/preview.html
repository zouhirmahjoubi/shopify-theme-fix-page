<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#471735">
    <meta name="description" content="إعلان مواقيت الدخول والخروج بملحقة ابن سينا الإعدادية">
    <title>إعلان مواقيت الدراسة — ملحقة ابن سينا الإعدادية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page-shell" aria-label="إعلان مدرسي متحرك">
      <article class="poster" aria-labelledby="school-name announcement-title">
        <div class="ambient-wash" aria-hidden="true"></div>

        <svg class="edge-mosaic edge-mosaic--north" viewBox="0 0 240 240" aria-hidden="true">
          <g class="ambient-piece ambient-piece--north">
            <path d="M120 0 140 33 178 24 171 62 204 82 171 102 178 140 140 133 120 166 100 133 62 140 69 102 36 82 69 62 62 24 100 33Z" fill="#a9d7c3"></path>
            <path d="m120 43 15 24 28-5-5 28 24 15-24 15 5 28-28-5-15 24-15-24-28 5 5-28-24-15 24-15-5-28 28 5Z" fill="#b84c36"></path>
            <path d="m120 78 17 27-17 27-17-27Z" fill="#f0e2c2"></path>
            <path d="M204 82h36v46l-36-23Z" fill="#e3a62c"></path>
            <path d="M36 82 0 105v-46Z" fill="#78325c"></path>
          </g>
        </svg>

        <svg class="edge-mosaic edge-mosaic--south" viewBox="0 0 280 220" aria-hidden="true">
          <g class="ambient-piece ambient-piece--south">
            <path d="M28 110 53 71 98 79 90 34 131 13l21 41 45-8-8 45 41 21-41 21 8 45-45-8-21 41-21-41-45 8 8-45Z" fill="#78325c"></path>
            <path d="m130 58 16 31 35 5-25 25 6 35-32-16-31 16 6-35-25-25 35-5Z" fill="#a9d7c3"></path>
            <path d="m130 86 20 25-20 25-20-25Z" fill="#b84c36"></path>
            <path d="m230 112 25-17 25 17-25 17Z" fill="#e3a62c"></path>
          </g>
        </svg>

        <button class="replay-button" type="button" aria-label="إعادة تشغيل حركة الإعلان" aria-describedby="motion-status" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.35-5.66M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span>إعادة العرض</span>
        </button>

        <div class="poster__grid">
          <header class="masthead js-flow-block">
            <div class="masthead__mark" aria-hidden="true">
              <svg viewBox="0 0 52 52">
                <path d="m26 1 7 12 14-2-2 14 12 7-12 7 2 14-14-2-7 12-7-12-14 2 2-14-12-7 12-7-2-14 14 2Z" fill="currentColor"></path>
                <path d="m26 15 9 17-9 17-9-17Z" fill="#f0e2c2"></path>
              </svg>
            </div>
            <p id="school-name">ملحقة ابن سينا الإعدادية</p>
            <span class="masthead__line" aria-hidden="true"></span>
          </header>

          <section class="hero" aria-labelledby="announcement-title">
            <svg class="hero-mosaic" viewBox="0 0 330 250" aria-hidden="true">
              <g class="hero-mosaic__tiles">
                <path class="mosaic-tile js-hero-tile" d="m90 5 26 39-26 39-26-39Z" fill="#a9d7c3"></path>
                <path class="mosaic-tile js-hero-tile" d="m90 83 39 26-39 26-39-26Z" fill="#b84c36"></path>
                <path class="mosaic-tile js-hero-tile" d="m12 83 39 26-39 26-39-26Z" fill="#e3a62c"></path>
                <path class="mosaic-tile js-hero-tile" d="m168 83 39 26-39 26-39-26Z" fill="#f0e2c2"></path>
                <path class="mosaic-tile js-hero-tile" d="m90 135 26 39-26 39-26-39Z" fill="#78325c"></path>
                <path class="mosaic-tile js-hero-tile" d="m168 5 26 39-26 39-26-39Z" fill="#b84c36"></path>
                <path class="mosaic-tile js-hero-tile" d="m246 5 26 39-26 39-26-39Z" fill="#a9d7c3"></path>
                <path class="mosaic-tile js-hero-tile" d="m246 83 39 26-39 26-39-26Z" fill="#e3a62c"></path>
                <path class="mosaic-tile js-hero-tile" d="m168 135 26 39-26 39-26-39Z" fill="#a9d7c3"></path>
                <path class="mosaic-tile js-hero-tile" d="m246 135 26 39-26 39-26-39Z" fill="#b84c36"></path>
                <path class="mosaic-tile js-hero-tile" d="m324 83 39 26-39 26-39-26Z" fill="#f0e2c2"></path>
              </g>
            </svg>
            <div class="hero__title-window js-hero-mask">
              <h1 id="announcement-title">إعلان</h1>
            </div>
            <span class="hero__slash hero__slash--one js-accent" aria-hidden="true"></span>
            <span class="hero__slash hero__slash--two js-accent" aria-hidden="true"></span>
          </section>

          <p class="notice-copy js-flow-block">
            بعد الرجوع إلى الساعة القانونية
            <strong>(توقيت غرينيتش)</strong>، ستتغير مواعيد الدخول والخروج كالتالي:
          </p>

          <section class="period period--morning js-schedule-block" aria-labelledby="morning-title">
            <header class="period__heading">
              <h2 id="morning-title">الفترة<br>الصباحية</h2>
            </header>
            <dl class="period__times">
              <div class="time-slot time-slot--morning js-time-block">
                <dt>موعد الدخول <span>صباحًا</span></dt>
                <dd>
                  <bdi class="time-display time-display--small" dir="ltr" aria-label="08:00">
                    <span class="digit-window"><span class="time-digit js-digit">0</span></span>
                    <span class="digit-window"><span class="time-digit js-digit">8</span></span>
                    <span class="time-colon">:</span>
                    <span class="digit-window"><span class="time-digit js-digit">0</span></span>
                    <span class="digit-window"><span class="time-digit js-digit">0</span></span>
                  </bdi>
                </dd>
              </div>
              <div class="time-slot time-slot--morning js-time-block">
                <dt>موعد الخروج <span>زوالًا</span></dt>
                <dd>
                  <bdi class="time-display time-display--small" dir="ltr" aria-label="12:00">
                    <span class="digit-window"><span class="time-digit js-digit">1</span></span>
                    <span class="digit-window"><span class="time-digit js-digit">2</span></span>
                    <span class="time-colon">:</span>
                    <span class="digit-window"><span class="time-digit js-digit">0</span></span>
                    <span class="digit-window"><span class="time-digit js-digit">0</span></span>
                  </bdi>
                </dd>
              </div>
            </dl>
          </section>

          <section class="period period--afternoon js-schedule-block" aria-labelledby="afternoon-title">
            <header class="period__heading period__heading--afternoon">
              <h2 id="afternoon-title">الفترة<br>المسائية</h2>
              <span aria-hidden="true"></span>
            </header>
            <dl class="period__times period__times--major">
              <div class="time-slot time-slot--major time-slot--entry js-time-block">
                <dt>موعد الدخول <span>بعد الزوال</span></dt>
                <dd>
                  <bdi class="time-display time-display--major" dir="ltr" aria-label="13:30">
                    <span class="digit-window"><span class="time-digit js-major-digit">1</span></span>
                    <span class="digit-window"><span class="time-digit js-major-digit">3</span></span>
                    <span class="time-colon js-major-colon">:</span>
                    <span class="digit-window"><span class="time-digit js-major-digit">3</span></span>
                    <span class="digit-window"><span class="time-digit js-major-digit">0</span></span>
                  </bdi>
                </dd>
              </div>
              <div class="time-slot time-slot--major time-slot--exit js-time-block">
                <dt>موعد الخروج <span>مساءً</span></dt>
                <dd>
                  <bdi class="time-display time-display--major" dir="ltr" aria-label="17:30">
                    <span class="digit-window"><span class="time-digit js-major-digit">1</span></span>
                    <span class="digit-window"><span class="time-digit js-major-digit">7</span></span>
                    <span class="time-colon js-major-colon">:</span>
                    <span class="digit-window"><span class="time-digit js-major-digit">3</span></span>
                    <span class="digit-window"><span class="time-digit js-major-digit">0</span></span>
                  </bdi>
                </dd>
              </div>
            </dl>
          </section>

          <footer class="poster__footer js-flow-block" aria-hidden="true">
            <span></span>
            <svg viewBox="0 0 90 28">
              <path d="m45 0 8 10 14-3-4 13 12 7H15l12-7-4-13 14 3Z" fill="#471735"></path>
              <path d="m45 7 7 10-7 10-7-10Z" fill="#b84c36"></path>
            </svg>
            <span></span>
          </footer>
        </div>
      </article>
      <p id="motion-status" class="sr-only" aria-live="polite"></p>
    </main>
    <noscript><p class="no-script-note">الحركة غير مفعّلة، ومحتوى الإعلان ظاهر بالكامل.</p></noscript>
    <script src="../../assets/gsap.min.js" defer></script>
    <script src="./script.js" defer></script>
  </body>
</html>
