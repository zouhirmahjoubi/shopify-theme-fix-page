            var base = series[0], last = series[series.length - 1];
            var grew = diff(base, last).map(function (s) {
              var k = s.split(' ')[0];
              return s + ' (per cycle: ' + series.map(function (c) { return c[k] || 0; }).join(', ') + ')';
            });
            H.phase = 'done';
            H.editorResult = {
              requested: H.editor, cycles: n, baseline: 'after cycle 1',
              listenersAtLoad: atLoad, listenersBefore: base, listenersAfter: last, perCycle: series,
              firstRegistration: diff(atLoad, base), grew: grew, stuck: stuck(),
              trace: H.trace
            };
            document.documentElement.setAttribute('data-harness-editor', 'done');
          }, (n === 1 || n >= total) ? SETTLE : GAP);
        })();
      }, 800);
    });
  })();
</script>
</body>
</html>
