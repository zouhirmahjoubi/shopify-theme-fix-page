<script>
  (function () {
    var H = window.__harness; if (!H || !H.editor) return;
    /* GSAP instances leak the same way listeners do: a ScrollTrigger or Observer that unload
       never kills is recreated by every load. Count them beside the listeners so the same
       cycle-1 to cycle-N growth rule (and shoot.py --allow-leak) covers them. */
    var countRaw = H.countListeners;
    H.countListeners = function () {
      var o = countRaw();
      if (window.ScrollTrigger && window.ScrollTrigger.getAll) {
        var st = window.ScrollTrigger.getAll().length; if (st) o['gsap:ScrollTrigger'] = st;
      }
      if (window.Observer && window.Observer.getAll) {
        var ob = window.Observer.getAll().length; if (ob) o['gsap:Observer'] = ob;
      }
      return o;
    };
    function fire(el, name, detail) { el.dispatchEvent(new CustomEvent(name, { bubbles: true, detail: detail })); }
    function cycle() {
      document.querySelectorAll('#MainContent > .shopify-section').forEach(function (s) {
        var id = s.id.replace(/^shopify-section-/, '');
        fire(s, 'shopify:section:unload', { sectionId: id, load: false });
        s.innerHTML = H.pristine[s.id];
        fire(s, 'shopify:section:load', { sectionId: id, load: true });
        fire(s, 'shopify:section:select', { sectionId: id, load: true });
      });
    }
    function stuck() {
      var out = [];
      document.querySelectorAll('#MainContent .shopify-section *').forEach(function (el) {
        var cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden' || el.closest('[hidden],[aria-hidden="true"],template,dialog:not([open])')) return;
        var r = el.getBoundingClientRect();
        if (r.width < 4 || r.height < 4) return;
        if (Number(cs.opacity) < 0.05 && (el.textContent || '').trim()) {
          out.push((el.tagName.toLowerCase()) + (el.id ? '#' + el.id : '') + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).join('.') : ''));
        }
      });
      return out;
    }
    /* Leak rule. The baseline is the count AFTER cycle 1 has settled, not the count at load:
       a library that registers once lazily (ScrollTrigger) or a scene that boots after an async
       import registers after load, so a load-time baseline reads every such page as "grew".
       A per-load leak adds one set per cycle, so only growth from cycle 1 to cycle N is flagged.
       That needs two cycles: ?editor=1 (the PLAN switch) runs 2, ?editor=N runs max(N, 2).
       The load -> cycle 1 delta is kept as "firstRegistration" (information, never a leak).
       ?editorSettle=MS (default 1700) is the wait after cycle 1 and after the last cycle. */
    var SETTLE = Number(new URLSearchParams(location.search).get('editorSettle')) || 1700;
    var GAP = 500;
    window.addEventListener('load', function () {
      setTimeout(function () {
        var atLoad = H.countListeners();
        var total = Math.max(H.editor, 2);
        var series = [];
        var n = 0;
        function diff(a, b) {
          var out = [];
          Object.keys(Object.assign({}, a, b)).sort().forEach(function (k) {
            if ((b[k] || 0) > (a[k] || 0)) out.push(k + ' ' + (a[k] || 0) + ' -> ' + b[k]);
          });
          return out;
        }
        (function next() {
          n++; H.phase = 'cycle ' + n; cycle();
          setTimeout(function () {
            series.push(H.countListeners());
            if (n < total) return next();
            var base = series[0], last = series[series.length - 1];
            var grew = diff(base, last).map(function (s) {
              var k = s.split(' ')[0];
              return s + ' (per cycle: ' + series.map(function (c) { return c[k] || 0; }).join(', ') + ')';
            });
            H.phase = 'done';
            H.editorResult = {
              requested: H.editor, cycles: n, baseline: 'after cycle 1',
              listenersAtLoad: atLoad, listenersBefore: base, listenersAfter: last, perCycle: series,
              firstRegistration: diff(atLoad, base), grew: grew, stuck: stuck(),
              trace: H.trace
            };
            document.documentElement.setAttribute('data-harness-editor', 'done');
          }, (n === 1 || n >= total) ? SETTLE : GAP);
        })();
      }, 800);
    });
  })();
</script>
