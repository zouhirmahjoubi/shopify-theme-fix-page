<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: order-slip.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bigelow+Rules:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f5f3e6}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2016px">
  <div class="r-header region chrome" data-region="header"><!-- the existing site header section (awning, topbar, nav with the shop sign), already built from its own assets --></div>
  <div class="r-breadcrumb region text" data-region="breadcrumb"><!-- breadcrumb Home / Cases / product title in small typewriter type --><p style="font-size:var(--r-breadcrumb-font);line-height:1.05;margin:0">breadcrumb</p></div>
  <div class="r-page-ground region texture" data-region="page-ground" style="background-image:url('..\..\..\assets\plates\page-ground.png');background-repeat:repeat"></div>
  <figure class="r-window-frame region plate" data-region="window-frame"><img src="..\..\..\assets\plates\window-frame.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-photo region plate" data-region="photo"><img src="..\..\..\assets\plates\photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-thumb-1 region plate" data-region="thumb-1"><img src="..\..\..\assets\plates\thumb-1.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-thumb-2 region plate" data-region="thumb-2"><img src="..\..\..\assets\plates\thumb-2.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-thumb-3 region plate" data-region="thumb-3"><img src="..\..\..\assets\plates\thumb-3.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-thumb-4 region plate" data-region="thumb-4"><img src="..\..\..\assets\plates\thumb-4.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-thumb-5 region plate" data-region="thumb-5"><img src="..\..\..\assets\plates\thumb-5.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-slip region chrome" data-region="slip"><!-- cream panel rotated about 1 degree with a row of punched circles along its top edge, dashed rules between lines and a soft drop shadow --></div>
  <div class="r-slip-paper region texture" data-region="slip-paper" style="background-image:url('..\..\..\assets\plates\slip-paper.png');background-repeat:repeat"></div>
  <figure class="r-tape region plate" data-region="tape"><img src="..\..\..\assets\plates\tape.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-title region text" data-region="title"><!-- product title in heavy high-contrast serif, two lines: Transparent Magnetic / Phone Case for iPhone --><p style="font-size:var(--r-title-font);font-family:var(--r-title-family),sans-serif;font-weight:var(--r-title-weight);line-height:1.05;margin:0">title</p></div>
  <div class="r-price region text" data-region="price"><!-- price $49.99 in heavy red serif --><p style="font-size:var(--r-price-font);line-height:1.05;margin:0">price</p></div>
  <div class="r-step-1 region control" data-region="step-1"><!-- line 1: red stamped circle numeral 1, typewriter label YOUR PHONE, answer iPhone 17 Pro / 18 Pro, underlined Change link: rebuild the control's chrome from the crop (comp-spec.mjs --crop step-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-step-2-label region text" data-region="step-2-label"><!-- red stamped circle numeral 2 and typewriter label STYLE --><p style="font-size:var(--r-step-2-label-font);line-height:1.05;margin:0">step-2-label</p></div>
  <div class="r-style-1 region control" data-region="style-1"><!-- selected style pill: Magnetic Case Camera Cutout Transparent, red outline and red text: rebuild the control's chrome from the crop (comp-spec.mjs --crop style-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-style-2 region control" data-region="style-2"><!-- unselected style pill: Camera Cutout Transparent, dashed cocoa outline: rebuild the control's chrome from the crop (comp-spec.mjs --crop style-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-step-3-label region text" data-region="step-3-label"><!-- red stamped circle numeral 3 and typewriter label HOW MANY --><p style="font-size:var(--r-step-3-label-font);line-height:1.05;margin:0">step-3-label</p></div>
  <div class="r-pack-1 region control" data-region="pack-1"><!-- pack ticket: 1 case $49.99 in a dashed box: rebuild the control's chrome from the crop (comp-spec.mjs --crop pack-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-pack-2 region control" data-region="pack-2"><!-- selected pack ticket: 2 cases $40.99 each, red outline, red ribbon flag Most popular: rebuild the control's chrome from the crop (comp-spec.mjs --crop pack-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-pack-3 region control" data-region="pack-3"><!-- pack ticket: 3 cases $34.49 each in a dashed box: rebuild the control's chrome from the crop (comp-spec.mjs --crop pack-3); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-total region text" data-region="total"><!-- handwritten total row: Total on the left, $81.98 on the right over a dashed rule --><p style="line-height:1.05;margin:0">total</p></div>
  <div class="r-cta region control" data-region="cta"><!-- wide red pill button Add to bag with darker bottom edge and glossy highlight: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-service-line region text" data-region="service-line"><!-- typewriter line: Free shipping · 30-day returns · Ships in 1-3 business days --><p style="font-size:var(--r-service-line-font);line-height:1.05;margin:0">service-line</p></div>
  <div class="r-divider region chrome" data-region="divider"><!-- thin dashed cocoa rule across the page --></div>
  <div class="r-next-heading region text" data-region="next-heading"><!-- next section heading in heavy serif: Made for your exact model --><p style="font-size:var(--r-next-heading-font);line-height:1.05;margin:0">next-heading</p></div>
</main>
</body>
</html>
