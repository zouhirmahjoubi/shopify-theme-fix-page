  <g filter="url(#panelShadow)">
    <path d="M93 591C115 578 139 584 161 588C185 579 208 584 232 590L937 588C959 580 982 588 989 606L985 906C966 924 944 918 922 913L161 918C136 927 112 919 95 902C105 859 90 825 99 787C107 749 89 707 98 669C104 642 88 619 93 591Z"
