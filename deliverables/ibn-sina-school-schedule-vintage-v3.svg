    <path d="M122 615C146 603 164 611 185 607H914C941 605 958 611 967 629V885C951 900 935 894 913 898H177C153 896 139 902 119 889Z" class="panelLine"/>
    <use href="#cornerCurl" x="105" y="590" width="143" height="76"/>
