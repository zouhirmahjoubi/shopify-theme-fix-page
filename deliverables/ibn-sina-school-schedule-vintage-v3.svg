    <use href="#cornerCurl" x="105" y="590" width="143" height="76" transform="translate(0 1511) scale(1 -1)"/>
    <use href="#cornerCurl" x="105" y="590" width="143" height="76" transform="translate(1080 1511) scale(-1 -1)"/>
