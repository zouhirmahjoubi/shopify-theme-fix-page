  </g>
  <text x="540" y="1023" class="ar rtl ink" font-size="49" font-weight="900" text-anchor="middle">الفترة المسائية</text>
  <use href="#divider" x="350" y="1038" width="380" height="34"/>
  <path d="M362 1090V1236M715 1090V1236" class="fineLine"/>

  <text x="827" y="1113" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">موعد الدخول</text>
  <text x="827" y="1179" class="num ink" font-size="55" font-weight="900" text-anchor="middle">13:30</text>
  <text x="827" y="1217" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">زوالاً</text>

  <text x="540" y="1113" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">عوض</text>
  <g transform="translate(451 1138)">
