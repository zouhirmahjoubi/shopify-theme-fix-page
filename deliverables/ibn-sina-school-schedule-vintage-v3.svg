  </g>

  <text x="255" y="751" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">موعد الخروج</text>
  <text x="255" y="817" class="num ink" font-size="55" font-weight="900" text-anchor="middle">12:00</text>
  <text x="255" y="855" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">زوالاً</text>

  <!-- evening schedule plaque -->
  <g filter="url(#panelShadow)">
    <path d="M93 953C115 940 139 946 161 950C185 941 208 946 232 952L937 950C959 942 982 950 989 968L985 1268C966 1286 944 1280 922 1275L161 1280C136 1289 112 1281 95 1264C105 1221 90 1187 99 1149C107 1111 89 1069 98 1031C104 1004 88 981 93 953Z"
