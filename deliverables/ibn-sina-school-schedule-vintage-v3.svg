    <path d="M122 977C146 965 164 973 185 969H914C941 967 958 973 967 991V1247C951 1262 935 1256 913 1260H177C153 1258 139 1264 119 1251Z" class="panelLine"/>
    <use href="#cornerCurl" x="105" y="952" width="143" height="76"/>
    <use href="#cornerCurl" x="105" y="952" width="143" height="76" transform="translate(1080 0) scale(-1 1)"/>
    <use href="#cornerCurl" x="105" y="952" width="143" height="76" transform="translate(0 2235) scale(1 -1)"/>
    <use href="#cornerCurl" x="105" y="952" width="143" height="76" transform="translate(1080 2235) scale(-1 -1)"/>
  </g>
  <g aria-hidden="true" opacity=".12" transform="translate(100 1027)">
