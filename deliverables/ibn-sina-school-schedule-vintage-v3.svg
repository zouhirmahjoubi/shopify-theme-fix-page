  <path d="M362 728V874M715 728V874" class="fineLine"/>

  <text x="827" y="751" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">موعد الدخول</text>
  <text x="827" y="817" class="num ink" font-size="55" font-weight="900" text-anchor="middle">08:00</text>
  <text x="827" y="855" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">صباحاً</text>

  <text x="540" y="751" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">عوض</text>
  <g transform="translate(451 776)">
    <path d="M18 0H160C178 0 184 18 172 32L160 47H18L6 32C-6 18 0 0 18 0Z" fill="#d7b46d" opacity=".58" stroke="#7c4a2b" stroke-width="2.5"/>
