<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"
     role="img" aria-labelledby="title desc" lang="ar" xml:lang="ar" direction="rtl"
     style="font-family:Tahoma,'Segoe UI',Arial,sans-serif">
  <title id="title">إعلان مواعيد ملحقة ابن سينا الإعدادية بطابع الخرائط القديمة</title>
  <desc id="desc">ملصق عربي قابل للتعديل، مستوحى من الورق المعتق والبوصلة واللفائف والزخارف النحاسية</desc>

  <defs>
    <linearGradient id="pagePaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2bd"/>
      <stop offset="0.28" stop-color="#f5e9c8"/>
      <stop offset="0.68" stop-color="#e7d29f"/>
      <stop offset="1" stop-color="#d6b97c"/>
    </linearGradient>
    <radialGradient id="pageGlow" cx="52%" cy="35%" r="76%">
      <stop offset="0" stop-color="#fff5d7" stop-opacity=".78"/>
      <stop offset=".64" stop-color="#e7cd94" stop-opacity=".24"/>
      <stop offset="1" stop-color="#775035" stop-opacity=".28"/>
    </radialGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbefca"/>
      <stop offset=".48" stop-color="#f1dfad"/>
      <stop offset="1" stop-color="#e2c789"/>
    </linearGradient>
    <linearGradient id="parchmentEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c6938"/>
      <stop offset=".22" stop-color="#e0bd72"/>
      <stop offset=".52" stop-color="#7b482b"/>
      <stop offset=".78" stop-color="#d2a55f"/>
      <stop offset="1" stop-color="#56301f"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3020"/>
      <stop offset=".22" stop-color="#c58b48"/>
      <stop offset=".46" stop-color="#7e4728"/>
      <stop offset=".72" stop-color="#d0a05a"/>
      <stop offset="1" stop-color="#48271d"/>
    </linearGradient>
    <radialGradient id="metal" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#f5dda0"/>
      <stop offset=".38" stop-color="#c69847"/>
      <stop offset=".75" stop-color="#76502c"/>
      <stop offset="1" stop-color="#362319"/>
    </radialGradient>
    <linearGradient id="scrollPaper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c632f"/>
      <stop offset=".12" stop-color="#d6a858"/>
      <stop offset=".5" stop-color="#ecd291"/>
      <stop offset=".88" stop-color="#b77935"/>
      <stop offset="1" stop-color="#75401f"/>
    </linearGradient>

    <filter id="paperTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        .42 0 0 0 .28
        0 .31 0 0 .20
        0 0 .18 0 .11
        0 0 0 .20 0" result="sepiaNoise"/>
      <feBlend in="SourceGraphic" in2="sepiaNoise" mode="multiply"/>
    </filter>
    <filter id="panelShadow" x="-18%" y="-24%" width="136%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#38251c" flood-opacity=".30"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#251710" flood-opacity=".38"/>
    </filter>
    <filter id="softInk" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#fff0c4" flood-opacity=".48"/>
    </filter>

    <pattern id="mapGrid" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M0 43H86M43 0V86" fill="none" stroke="#70472e" stroke-width="1" opacity=".075"/>
      <circle cx="43" cy="43" r="23" fill="none" stroke="#70472e" stroke-width="1" opacity=".055"/>
    </pattern>

    <symbol id="cornerCurl" viewBox="0 0 170 90">
      <path d="M6 77C25 68 25 49 14 38C35 43 47 31 43 13C59 29 78 25 91 9C91 29 107 39 126 34C112 47 115 64 132 74C112 75 100 69 91 57C79 72 61 78 43 68C33 81 20 85 6 77Z"
