    <use href="#cornerCurl" x="142" y="96" width="130" height="69" transform="translate(0 372) scale(1 -1)"/>
    <use href="#cornerCurl" x="142" y="96" width="130" height="69" transform="translate(1080 372) scale(-1 -1)"/>
  </g>

