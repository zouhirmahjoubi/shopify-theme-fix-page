      <path d="M180 2l12 15-12 15-12-15z" fill="url(#bronze)" stroke="#4b2a1d" stroke-width="2"/>
      <circle cx="180" cy="17" r="4" fill="#f2d48f"/>
    </symbol>

    <symbol id="compass" viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="111" fill="#4a2c1f" opacity=".38"/>
      <circle cx="120" cy="120" r="104" fill="url(#metal)" stroke="#34221b" stroke-width="7"/>
      <circle cx="120" cy="120" r="84" fill="#e4ca83" stroke="#593822" stroke-width="5"/>
      <circle cx="120" cy="120" r="72" fill="#d9bb6b" stroke="#6d4728" stroke-width="2"/>
