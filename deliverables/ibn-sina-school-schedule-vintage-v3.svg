      <path d="M70 65C59 95 68 123 55 149C43 173 62 193 80 205C99 218 89 248 68 267" fill="none" stroke="#6b4427" stroke-width="3" opacity=".45"/>
      <path d="M21 22h118v22H21zM20 321h119v23H20z" rx="11" fill="url(#bronze)" stroke="#3b251a" stroke-width="5"/>
      <circle cx="22" cy="33" r="16" fill="url(#metal)" stroke="#3d271c" stroke-width="5"/>
      <circle cx="138" cy="33" r="16" fill="url(#metal)" stroke="#3d271c" stroke-width="5"/>
      <circle cx="22" cy="333" r="16" fill="url(#metal)" stroke="#3d271c" stroke-width="5"/>
      <circle cx="138" cy="333" r="16" fill="url(#metal)" stroke="#3d271c" stroke-width="5"/>
    </symbol>

    <style>
      .ink { fill:#3e271c; }
      .muted { fill:#735035; }
      .goldText { fill:#9a5c2e; }
      .ar { font-family:Tahoma,"Segoe UI",Arial,sans-serif; }
      .rtl { direction:rtl; unicode-bidi:plaintext; }
      .num { direction:ltr; unicode-bidi:isolate; font-family:Tahoma,"Segoe UI",Arial,sans-serif; }
      .panelLine { fill:none; stroke:#75462c; stroke-width:3; opacity:.88; }
      .fineLine { fill:none; stroke:#be8849; stroke-width:1.5; opacity:.78; }
      .mapLine { fill:none; stroke:#6e4932; stroke-width:2; opacity:.075; }
    </style>
  </defs>

  <!-- aged atlas page -->
  <rect width="1080" height="1440" fill="#cdc8bf"/>
  <g filter="url(#panelShadow)">
    <path d="M35 31L1040 26L1050 1398L32 1409Z" fill="url(#pagePaper)" stroke="#6a4630" stroke-width="5"/>
  </g>
  <path d="M43 39L1033 35L1041 1389L41 1400Z" fill="url(#pageGlow)"/>
  <path d="M43 39L1033 35L1041 1389L41 1400Z" fill="url(#mapGrid)"/>
  <path d="M43 39L1033 35L1041 1389L41 1400Z" fill="#b78344" opacity=".17" filter="url(#paperTexture)"/>

  <!-- faint cartography traces -->
  <g aria-hidden="true">
    <path class="mapLine" d="M66 160C172 83 245 126 336 92C435 54 528 79 621 124C706 165 785 146 879 91C947 51 1008 85 1032 121"/>
    <path class="mapLine" d="M51 1170C167 1113 238 1161 340 1114C459 1059 555 1102 647 1150C733 1195 837 1153 1037 1098"/>
