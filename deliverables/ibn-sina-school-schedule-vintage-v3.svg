    <text x="89" y="35" class="num ink" font-size="36" font-weight="900" text-anchor="middle">14:30</text>
  </g>

  <text x="255" y="1113" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">موعد الخروج</text>
  <text x="255" y="1179" class="num ink" font-size="55" font-weight="900" text-anchor="middle">17:30</text>
  <text x="255" y="1217" class="ar rtl muted" font-size="26" font-weight="700" text-anchor="middle">مساءً</text>

