      <path d="M120 49L138 107L191 120L139 137L120 191L103 138L49 120L102 103Z" fill="#553021" stroke="#2c1c17" stroke-width="3"/>
      <path d="M120 49L120 120L102 103Z" fill="#e7c871"/>
      <path d="M191 120L120 120L139 137Z" fill="#c79643"/>
      <path d="M120 191L120 120L103 138Z" fill="#e7c871"/>
