    <use href="#cornerCurl" x="58" y="50" width="180" height="95" transform="translate(1080 0) scale(-1 1)"/>
    <use href="#cornerCurl" x="58" y="50" width="180" height="95" transform="translate(0 1441) scale(1 -1)"/>
    <use href="#cornerCurl" x="58" y="50" width="180" height="95" transform="translate(1080 1441) scale(-1 -1)"/>
  </g>

