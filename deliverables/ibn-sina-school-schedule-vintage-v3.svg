    <use href="#cornerCurl" x="123" y="342" width="105" height="56" transform="translate(0 877) scale(1 -1)"/>
    <use href="#cornerCurl" x="123" y="342" width="105" height="56" transform="translate(1080 877) scale(-1 -1)"/>
  </g>
  <text x="540" y="400" class="ar rtl ink" font-size="32" font-weight="700" text-anchor="middle">بعد الرجوع إلى الساعة القانونية</text>
  <text x="540" y="446" class="ar rtl ink" font-size="32" font-weight="700" text-anchor="middle">(توقيت غرينتش)، ستتغير مواعيد</text>
  <text x="540" y="493" class="ar rtl ink" font-size="38" font-weight="800" text-anchor="middle">الدخول والخروج.</text>

