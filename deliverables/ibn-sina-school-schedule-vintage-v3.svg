  </g>
  <g transform="translate(507 1354)" aria-hidden="true">
    <circle cx="33" cy="0" r="18" fill="url(#metal)" stroke="#4b2d20" stroke-width="3"/>
    <path d="M33-11L39-2L50 0L41 7L43 18L33 12L23 18L25 7L16 0L27-2Z" fill="#60402a"/>
