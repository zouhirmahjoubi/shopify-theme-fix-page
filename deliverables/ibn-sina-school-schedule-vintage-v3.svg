      <path d="M18 69C36 60 35 44 27 36C46 42 60 31 57 19C70 30 85 27 94 17C95 36 109 44 121 43C106 54 108 64 119 70"
            fill="none" stroke="#efd18f" stroke-width="2.4" stroke-linecap="round" opacity=".72"/>
      <path d="M44 67C64 57 73 45 76 29M77 62c15-10 20-23 18-38" fill="none" stroke="#49291d" stroke-width="3" stroke-linecap="round"/>
      <circle cx="51" cy="42" r="5" fill="#4c2a1e"/>
      <circle cx="93" cy="48" r="4" fill="#e6bf72"/>
    </symbol>

